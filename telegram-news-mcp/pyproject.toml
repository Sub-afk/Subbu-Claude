[project]
name = "telegram-news-mcp"
version = "0.1.0"
description = "MCP server that pulls the latest news PDF from a Telegram group and serves it to an AI client for curation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "telethon>=1.36,<2",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
telegram-news-mcp = "telegram_news_mcp.server:main"
telegram-news-login = "telegram_news_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_news_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
